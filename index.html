(function() {

  var MAX_PX = 4096, MIN_FONT_PX = 12;

    var BOX = {width: 'clientWidth', height: 'clientHeight'}, D = {};
    Object.keys(BOX).forEach(function(p) {
      D[p] = Object.getOwnPropertyDescriptor(CP, p);
    });
    var tracking = function(el, p) {
      var box = el[BOX[p]];
      return !el.style[p] && box > 0 && box === D[p].get.call(el) &&
          box === el['__lumiLast' + p];

    var MAX = {width: 'maxWidth', height: 'maxHeight'};
    var PAD = {width: ['paddingLeft', 'paddingRight'],

      var pe = el.parentElement;

      return pe[BOX[p]] - parseFloat(cs[PAD[p][0]]) -
          parseFloat(cs[PAD[p][1]]);
    };

      var d = D[p];
      if (!d || !d.set || !d.get) return;
      Object.defineProperty(CP, p, {

        set: function(v) {

          if (n > box && tracking(this, p)) {
            var el = this, pins = {};
            Object.keys(BOX).forEach(function(q) {
              if (tracking(el, q)) pins[q] = avail(el, q) ||
                  el['__lumiBox' + q];

            Object.keys(pins).forEach(function(q) {
              el.style[q] = '100%';
              el.style[MAX[q]] = pins[q] + 'px';
            });

          this['__lumiLast' + p] = n;

/*
 * Luminous runtime stylesheet — injected once into every generated widget's
 * <head> by the C++ widget agent (id="lumi-runtime"). Single Source of Truth
 * for ALL design tokens and pre-baked .lumi-* component classes. The SI prompts
 * (design.md / html_generation.jinja2 / chart.jinja2) must NOT re-declare these
 * tokens or component CSS; they only reference them.
 *
 * Sections:
 *   1. Web fonts (Google Sans Flex + Google Sans Code)
 *   2. Light token :root (from previewer tokens.css, verbatim)
 *   3. Dark token overrides — REMAPPED to :root so canvas/D3 readers of
 *      getComputedStyle(document.documentElement) resolve dark values (D3).
 *   4. Short diagram/chart aliases (bridge legacy --surface / --chart-N names).
 *   5. In-scope pre-baked .lumi-* component classes.
 */

 *    .lumi-* control has a functional CSS glyph dependency on it, and the
 *    icon ban forbids decorative icons (Decision D2).
 * ============================================================ */

/* ============================================================
 * 4. SHORT DIAGRAM / CHART ALIASES
 *    Legacy diagram.md and chart.jinja2 reference short names such as
 *    --surface, --on-surface, --chart-1..10, --primary, --r-full. These MUST
 *    resolve to the canonical --lumi-sys-color--* tokens (which flip in dark
 *    mode) — otherwise every diagram var() falls back to black (historical
 *    mass-regression bug #4). Light-hex fallbacks are a last resort only.
 * ============================================================ */
:root {
  /* surfaces */
  --surface: var(--lumi-sys-color--surface, #fdfcfc);
  --surface-dim: var(--lumi-sys-color--surface-dim, #f2f0f0);
  --surface-bright: var(--lumi-sys-color--surface-bright, #ffffff);
  --surface-container: var(--lumi-sys-color--surface-container, #f2f0f0);
  --surface-container-high: var(--lumi-sys-color--surface-container-high, #e6e6e6);
  --surface-container-lowest: var(--lumi-sys-color--surface, #ffffff);
  --surface-accent: var(--lumi-sys-color--surface-accent, #9dd2ff);
  --surface-translucent: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  --surface-glass: var(--lumi-sys-color--surface-translucent, rgba(255, 255, 255, 0.88));
  /* foreground */

  --on-surface-variant: var(--lumi-sys-color--on-surface-variant, rgba(0, 0, 0, 0.55));
  --on-surface-low: var(--lumi-sys-color--on-surface-low, rgba(0, 0, 0, 0.08));
  /* accents / brand */

  --accent: var(--lumi-sys-color--accent, #9dd2ff);
  --accent-container: var(--lumi-sys-color--accent-container, #dcf1ff);

/* ============================================================
 * 5. IN-SCOPE PRE-BAKED COMPONENT CLASSES
 *    Interactive controls + simple display components only (Decision D5).
 *    Complex components (timeline, sequence, stepper, pros-cons, hero, HUD,
 *    hotspot, media grid) are intentionally excluded.
 * ============================================================ */

/* Global font rendering quality + themed surface backdrop.
 * background/color MUST be set here (SSoT) so the widget backdrop follows the
 * light/dark surface token deterministically. Without this, a widget whose
 * model-generated markup forgets `background: var(--surface)` on its root
 * container falls back to the browser-default white body, producing a broken
 * dark mode (light header/chart area behind a dark card). Regression source:
 * batch1 PB-A02 dark. */
html, body {
  background: var(--body-bg, transparent) !important;
  color: var(--on-surface) !important;
  /* Auto-resizing iframe: content grows the frame, never scrolls the document.
   * Model widgets already emit this; declared here as the SSoT default. */
  overflow-y: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  text-rendering: optimizeLegibility;
}

.widget-container {
  width: 100% !important;
  max-width: 100% !important;
  padding-inline: 0 !important;
  box-sizing: border-box;
}

/* ============================================================
 * SCROLLBAR DISCIPLINE (single source of truth)
 *   Long lists/cards flow and let the iframe auto-resize (see the C++
 *   NeutralizeInnerScroll pass, which removes accidental tiny scroll boxes).
 *   For LEGITIMATE overflow that remains (wide tables, code, pan-containers,
 *   large >=240px viewports) render a slim, theme-aware scrollbar.
 *   One token carries the correct light/dark contrast (the auto-flipped
 *   stroke token is too dark on #0f0f0f), referenced once = SSoT.
 * ============================================================ */
:root { --lumi-scrollbar-thumb: rgba(0, 0, 0, 0.20); }
:root[data-theme="dark"], body.dark-mode { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --lumi-scrollbar-thumb: rgba(255, 255, 255, 0.20); }
}
* {
  scrollbar-width: thin;
  scrollbar-color: var(--lumi-scrollbar-thumb) transparent;
}
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background-color: var(--lumi-scrollbar-thumb);
  border-radius: var(--lumi-sys-shape--full, 999px);
}

/* --- Buttons --- */
/* Universal button fallback (element specificity 0,0,1) — beats `* { padding: 0 }`
   author resets (0,0,0) while still yielding to any author class selector (0,1,0). */
button {
  appearance: none;
  -webkit-appearance: none;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--lumi-sys-spacing--xs, 6px);

<script id="lumi-os-theme-init">
(function() {
  function syncBody() {
    var dt = document.documentElement.getAttribute('data-theme');
    if (document.body && (dt === 'dark' || dt === 'light')) {
      document.body.classList.toggle('dark-mode', dt === 'dark');
    }
  }
  function syncTheme(theme) {
    if (theme !== 'dark' && theme !== 'light') return;
    document.documentElement.setAttribute('data-theme', theme);
    syncBody();
  }
  if (typeof MutationObserver === 'function') {
    new MutationObserver(syncBody).observe(document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
  }
  if (typeof document.addEventListener === 'function') {
    document.addEventListener('DOMContentLoaded', syncBody);
  }
  try {
    var mq = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)');
    if (mq) {
      var cur = document.documentElement.getAttribute('data-theme');
      if (!cur) {
        syncTheme(mq.matches ? 'dark' : 'light');
      } else {
        syncTheme(cur);
      }
      if (mq.addEventListener) {
        mq.addEventListener('change', function(e) {
          syncTheme(e.matches ? 'dark' : 'light');
        });
      }
    }
  } catch (e) {}
  window.addEventListener('message', function(e) {
    if (e.data && (e.data.type === 'set-theme' || e.data.type === 'APPLY_THEME') && e.data.theme) {
      syncTheme(e.data.theme);
    }
  });
})();
</script>

    ];

    // Reactive State
    const state = {
      items: [...INITIAL_ITEMS],
      currency: 'EUR', // 'EUR' | 'BRL'
      exchange_rate: 5.60,
      selected_category: 'Todas',
      selected_day: null,
      editing_item_id: null
    };

    // ===== Supabase (banco compartilhado) =====
    // Preencha com os dados do seu projeto: Supabase > Project Settings > API
    const SUPABASE_URL = 'https://bzixokkcnfxmjohegbxv.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_WaoLwjVKXWCvFzEgR7gn9Q_Z1hxqkoG';
    const db = (window.supabase && SUPABASE_URL.startsWith('https://'))
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    function fromRow(r) {
      return { id: r.id, item: r.item, cat: r.cat, day: r.day, date: `Dia ${r.day}`, eur: Number(r.eur) };
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // Global Chart Handles
    let donutChartInstance = null;
    let barChartInstance = null;

    // Helper: Number Formatter with dot as thousand separator
    function formatCurrency(val, currency = state.currency) {
      const converted = currency === 'BRL' ? val * state.exchange_rate : val;
      const formatted = converted.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return currency === 'BRL' ? `R$ ${formatted}` : `€ ${formatted}`;
    }

    function formatNumber(val) {
      return val.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function getTheme() {
      return document.documentElement.getAttribute('data-theme') || 'light';
    }

    function toggleTheme() {
      const current = getTheme();
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      document.getElementById('theme-toggle-btn').textContent = next === 'dark' ? '🌙' : '☀️';
      updateViz();
    }

    function setCurrency(curr) {
      state.currency = curr;
      document.getElementById('btn-eur').classList.toggle('is-active', curr === 'EUR');
      document.getElementById('btn-brl').classList.toggle('is-active', curr === 'BRL');
      updateViz();
    }

    function handleRateChange(val) {
      const num = parseFloat(val);
      if (!isNaN(num) && num > 0) {
        state.exchange_rate = num;
        updateViz();
      }
    }

    function selectCategory(cat) {
      if (state.selected_category === cat) {
        state.selected_category = 'Todas';
      } else {
        state.selected_category = cat;
      }
      updateViz();
    }

    function selectDay(day) {
      if (state.selected_day === day) {
        state.selected_day = null;
      } else {
        state.selected_day = day;
      }
      updateViz();
    }

    // Modal Operations
    function populateModalCategories() {
      const sel = document.getElementById('modal-item-cat');
      if (sel) sel.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    function openAddModal() {
      state.editing_item_id = null;
      document.getElementById('modal-title-text').textContent = 'Nova Despesa';
      document.getElementById('modal-item-name').value = '';
      document.getElementById('modal-item-day').value = 1;
      document.getElementById('modal-item-eur').value = '';
      document.getElementById('modal-delete-btn').style.display = 'none';
      populateModalCategories();
      document.getElementById('item-modal').classList.add('is-open');
    }

    function openEditModal(id) {
      const item = state.items.find(i => i.id === id);
      if (!item) return;
      state.editing_item_id = id;
      document.getElementById('modal-title-text').textContent = 'Editar Despesa';
      document.getElementById('modal-item-name').value = item.item;
      document.getElementById('modal-item-day').value = item.day;
      document.getElementById('modal-item-eur').value = item.eur;
      populateModalCategories();
      document.getElementById('modal-item-cat').value = item.cat;
      document.getElementById('modal-delete-btn').style.display = 'inline-block';
      document.getElementById('item-modal').classList.add('is-open');
    }

    function closeModal() {
      document.getElementById('item-modal').classList.remove('is-open');
    }

    async function deleteCurrentItem() {
      if (state.editing_item_id !== null) {
        if (!confirm('Excluir esta despesa?')) return;
        if (db) {
          const { error } = await db.from('despesas').delete().eq('id', state.editing_item_id);
          if (error) { alert('Erro ao excluir: ' + error.message); return; }
        }
        state.items = state.items.filter(i => i.id !== state.editing_item_id);
        closeModal();
        updateViz();
      }
    }

    async function saveItemModal() {
      const name = document.getElementById('modal-item-name').value.trim() || 'Nova Despesa';
      const cat = document.getElementById('modal-item-cat').value;
      const day = parseInt(document.getElementById('modal-item-day').value, 10) || 1;
      const eur = parseFloat(document.getElementById('modal-item-eur').value) || 0;

      if (db) {
        const row = { item: name, cat, day, eur };
        const res = state.editing_item_id !== null
          ? await db.from('despesas').update(row).eq('id', state.editing_item_id)
          : await db.from('despesas').insert(row);
        if (res.error) { alert('Erro ao salvar: ' + res.error.message); return; }
        closeModal();
        await loadItems();
        return;
      }

      if (state.editing_item_id !== null) {
        const item = state.items.find(i => i.id === state.editing_item_id);
        if (item) {
          item.item = name;
          item.cat = cat;
          item.day = day;
          item.date = `Dia ${day}`;
          item.eur = eur;
        }
      } else {
        const newId = state.items.length ? Math.max(...state.items.map(i => i.id)) + 1 : 1;
        state.items.unshift({
          id: newId,
          item: name,
          cat: cat,
          day: day,
          date: `Dia ${day}`,
          eur: eur
        });
      }
      closeModal();
      updateViz();
    }

    // Main Update Visualizer Engine
    function updateViz() {
      const isDark = getTheme() === 'dark';
      const textColor = isDark ? '#e0e0e0' : '#000000';
      const textDim = isDark ? 'rgba(255,255,255,0.55)' : 'rgba(0,0,0,0.55)';
      const gridColor = isDark ? '#2d2f38' : '#e3e3e3';

      // 1. Calculate Aggregates
      const totalGeneralEur = state.items.reduce((sum, item) => sum + item.eur, 0);
      document.getElementById('total-geral-val').textContent = formatCurrency(totalGeneralEur);

      // Category Totals
      const categoryTotals = {};
      CATEGORIES.forEach(c => categoryTotals[c] = 0);
      state.items.forEach(item => {
        if (categoryTotals[item.cat] !== undefined) {
          categoryTotals[item.cat] += item.eur;
        } else {
          categoryTotals['Outros'] += item.eur;
        }
      });

      // Selected Category Total
      let selectedCatTotal = totalGeneralEur;
      let selectedCatPct = 100;
      if (state.selected_category !== 'Todas') {
        selectedCatTotal = categoryTotals[state.selected_category] || 0;
        selectedCatPct = totalGeneralEur > 0 ? (selectedCatTotal / totalGeneralEur) * 100 : 0;
      }

      // Update Center Donut Text
      document.getElementById('donut-center-val').textContent = formatCurrency(selectedCatTotal);
      document.getElementById('donut-center-pct').textContent = `${formatNumber(selectedCatPct)}%`;
      document.getElementById('donut-filter-label').textContent = state.selected_category;

      // 2. Render Filter Chips with Opacity Attenuation
      const chipsContainer = document.getElementById('category-filter-chips');
      const allFilterCategories = ['Todas', ...CATEGORIES];
      
      if (chipsContainer) chipsContainer.innerHTML = allFilterCategories.map(cat => {
        const isActive = state.selected_category === cat;
        const isDimmed = state.selected_category !== 'Todas' && !isActive;
        const color = PALETTE[cat] || '#3B82F6';
        
        return `
          <button class="cat-chip ${isActive ? 'is-active' : ''} ${isDimmed ? 'is-dimmed' : ''}" 
                  style="color: ${isActive ? color : getCssVar('--on-surface')};"
                  onclick="selectCategory('${cat}')">
            <span class="cat-chip-dot" style="background-color: ${color};"></span>
            <span>${cat}</span>
          </button>
        `;
      }).join('');

      // 3. Render Donut Chart (Chart.js)
      renderDonutChart(categoryTotals, totalGeneralEur, isDark, textColor, gridColor);

      // 4. Render Daily Bar Chart (Chart.js)
      renderBarChart(isDark, textColor, textDim, gridColor);

      // 5. Render Detailed Items List (Strict Category Filtering)
      renderItemList();
    }

    function renderDonutChart(categoryTotals, totalGeneralEur, isDark, textColor, gridColor) {
      if (typeof Chart === 'undefined') return;

      const ctx = document.getElementById('donutChart').getContext('2d');
      
      // Calculate background colors with opacity attenuation
      const sliceColors = CATEGORIES.map(cat => {
        const baseColor = PALETTE[cat];
        if (state.selected_category === 'Todas' || state.selected_category === cat) {
          return baseColor;
        }
        // Attenuated / Faded opacity (0.20)
        return (typeof baseColor === 'number' ? Math.round(baseColor * 100) / 100 : baseColor) + '33'; // 33 in hex is ~20% alpha
      });

      const sliceData = CATEGORIES.map(cat => {
        const val = categoryTotals[cat];
        return state.currency === 'BRL' ? val * state.exchange_rate : val;
      });

      if (donutChartInstance) {
        donutChartInstance.data.datasets[0].data = sliceData;
        donutChartInstance.data.datasets[0].backgroundColor = sliceColors;
        donutChartInstance.update('none');
      } else {
        donutChartInstance = new Chart(ctx, {
          type: 'doughnut',
          data: {
            labels: CATEGORIES,
            datasets: [{
              data: sliceData,
              backgroundColor: sliceColors,
              borderColor: isDark ? '#1c1c1c' : '#ffffff',
              borderWidth: 2,
              borderRadius: 4,
              spacing: 1,
              hoverOffset: 6
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            cutout: '72%',
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const label = context.label || '';
                    const valEur = categoryTotals[label] || 0;
                    const pct = totalGeneralEur > 0 ? (valEur / totalGeneralEur) * 100 : 0;
                    return `${label}: ${formatCurrency(valEur)} (${formatNumber(pct)}%)`;
                  }
                }
              }
            },
            onClick: (evt, activeEls) => {
              if (activeEls.length > 0) {
                const index = activeEls[0].index;
                const clickedCat = CATEGORIES[index];
                selectCategory(clickedCat);
              }
            }
          }
        });
      }
    }

    function renderBarChart(isDark, textColor, textDim, gridColor) {
      if (typeof Chart === 'undefined') return;

      const ctx = document.getElementById('barChart').getContext('2d');

      // Group items by day (1 to 13)
      const days = Array.from({length: 13}, (_, i) => i + 1);
      const dayTotals = days.map(day => {
        const itemsForDay = state.items.filter(item => {
          const matchDay = item.day === day;
          const matchCat = state.selected_category === 'Todas' || item.cat === state.selected_category;
          return matchDay && matchCat;
        });
        const sumEur = itemsForDay.reduce((s, i) => s + i.eur, 0);
        return state.currency === 'BRL' ? sumEur * state.exchange_rate : sumEur;
      });

      const dayLabels = days.map(d => `D${d}`);

      // Highlight colors
      const barColors = days.map(d => {
        const isSelected = state.selected_day === d;
        const base = state.selected_category === 'Todas' ? PALETTE['Todas'] : PALETTE[state.selected_category];
        if (state.selected_day !== null && !isSelected) {
          return (typeof base === 'number' ? Math.round(base * 100) / 100 : base) + '40'; // dimmed
        }
        return base;
      });

      if (barChartInstance) {
        barChartInstance.data.labels = dayLabels;
        barChartInstance.data.datasets[0].data = dayTotals;
        barChartInstance.data.datasets[0].backgroundColor = barColors;
        barChartInstance.options.scales.y.ticks.color = textDim;
        barChartInstance.options.scales.x.ticks.color = textDim;
        barChartInstance.options.scales.y.grid.color = gridColor;
        barChartInstance.update('none');
      } else {
        barChartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: dayLabels,
            datasets: [{
              data: dayTotals,
              backgroundColor: barColors,
              borderRadius: { topLeft: 6, topRight: 6, bottomLeft: 0, bottomRight: 0 },
              maxBarThickness: 18,
              categoryPercentage: 0.8,
              barPercentage: 0.9
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: function(context) {
                    const dayNum = days[context.dataIndex];
                    const val = context.raw;
                    const formatted = state.currency === 'BRL' 
                      ? `R$ ${formatNumber(val)}` 
                      : `€ ${formatNumber(val)}`;
                    return `Dia ${dayNum}: ${formatted}`;
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                border: { display: false },
                ticks: {
                  font: { family: 'monospace', size: 10 },
                  color: textDim,
                  padding: 4
                }
              },
              y: {
                grid: { color: gridColor, drawBorder: false },
                border: { display: false },
                ticks: {
                  stepSize: 100, // Strictly 100 by 100 steps
                  font: { family: 'monospace', size: 10 },
                  color: textDim,
                  padding: 6
                }
              }
            },
            onClick: (evt, activeEls) => {
              if (activeEls.length > 0) {
                const index = activeEls[0].index;
                const clickedDay = days[index];
                selectDay(clickedDay);
              } else {
                selectDay(null);
              }
            }
          }
        });
      }
    }

    function renderItemList() {
      const container = document.getElementById('items-list');

      // STRICT Filtering by Category and Day
      const filtered = state.items.filter(item => {
        const matchCat = state.selected_category === 'Todas' || item.cat === state.selected_category;
        const matchDay = state.selected_day === null || item.day === state.selected_day;
        return matchCat && matchDay;
      });

      document.getElementById('items-count-badge').textContent = `${filtered.length} registro${filtered.length !== 1 ? 's' : ''}`;

      if (filtered.length === 0) {
        if (container) container.innerHTML = `
          <div style="padding: 20px; text-align: center; color: var(--on-surface-variant); font-size: 12px;">
            Nenhum lançamento encontrado para os filtros selecionados.
          </div>`;
        return;
      }

      if (container) container.innerHTML = filtered.map(item => {
        const catColor = PALETTE[item.cat] || '#64748B';
        const primaryVal = formatCurrency(item.eur);
        const secondaryVal = state.currency === 'EUR' 
          ? `R$ ${formatNumber(item.eur * state.exchange_rate)}`
          : `€ ${formatNumber(item.eur)}`;

        return `
          <div class="item-row" onclick="openEditModal(${item.id})">
            <div class="item-left">
              <div class="item-cat-badge" style="background-color: ${catColor};"></div>
              <div class="item-details">
                <span class="item-title">${escapeHtml(item.item)}</span>
                <span class="item-sub">
                  <span>${item.date}</span>
                  <span>•</span>
                  <span>${item.cat}</span>
                </span>
              </div>
            </div>
            <div class="item-right">
              <div class="item-val">${primaryVal}</div>

    // Auto-Resize & Theme Message Listener Setup
    async function loadItems() {
      if (!db) return;
      const { data, error } = await db.from('despesas').select('*').order('eur', { ascending: false });
      if (error) { alert('Erro ao carregar despesas: ' + error.message); return; }
      state.items = data.map(fromRow);
      updateViz();
    }

    function initApp() {
      updateViz();
      if (db) {
        loadItems();
        db.channel('despesas-rt')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'despesas' }, () => loadItems())
          .subscribe();
      }
    }

    // Initialize application when DOM is ready
    initApp();

    const applyTheme = t => { 
      document.documentElement.setAttribute('data-theme', t); 
      document.getElementById('theme-toggle-btn').textContent = t === 'dark' ? '🌙' : '☀️';
      if (typeof updateViz === 'function') updateViz(); 
    };

    if (!document.documentElement.hasAttribute('data-theme') && window.matchMedia?.('(prefers-color-scheme: dark)').matches) {
      applyTheme('dark');
    }

    window.addEventListener('message', e => { 
      if (e.data?.type === 'set-theme' || e.data?.type === 'APPLY_THEME') applyTheme(e.data.theme); 
    });

    (function autoResize() {
      function notifyHeight() {
        const c = document.querySelector('.widget-container') || document.body;
        if (!c) return;
        const h = Math.ceil(Math.max(c.getBoundingClientRect().bottom, c.scrollHeight));
        window.parent.postMessage({type: 'widget-resize', height: h}, '*');
      }
      window.addEventListener('load', () => setTimeout(notifyHeight, 120));
      new ResizeObserver(() => notifyHeight()).observe(document.querySelector('.widget-container') || document.body);
    })();
  </script>
